name: Build source-quotas research PDF
on:
  push:
    branches: [research/linear-source-quotas]
    paths:
      - '.github/workflows/build-source-quotas-pdf.yml'
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert complete proof to an unsigned academic PDF
        run: |
          mkdir -p paper
          docker run --rm -v "$PWD:/data" -w /data pandoc/latex:latest \
            linear-source-quotas.md \
            --from=markdown+tex_math_dollars+tex_math_single_backslash \
            --to=pdf \
            --pdf-engine=xelatex \
            --output=paper/linear-source-quotas.pdf \
            --metadata=title:'Weighted Dedicated Actuator Placement under Mixed Failures' \
            --metadata=author:'' \
            --variable=geometry:margin=1in \
            --variable=fontsize:10pt \
            --variable=colorlinks:true
          test -s paper/linear-source-quotas.pdf
      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/linear-source-quotas.pdf
          git commit -m "Add unsigned compiled PDF for linear source-quota theorem"
          git push