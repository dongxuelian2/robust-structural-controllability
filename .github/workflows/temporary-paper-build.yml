name: Temporary manuscript PDF build
on:
  push:
    branches:
      - editorial/preprint-polish-2026-11
permissions:
  contents: write
jobs:
  latex:
    if: "!contains(github.event.head_commit.message, '[pdf-built]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/robust-dedicated-actuator-placement.tex
          work_in_root_file_dir: true
      - name: Commit updated PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/robust-dedicated-actuator-placement.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild manuscript PDF [pdf-built]"
          git push origin HEAD:editorial/preprint-polish-2026-11
