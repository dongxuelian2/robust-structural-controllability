name: Build corrected manuscript
on:
  push:
    branches: ['revision/control-manuscript']
    paths: ['paper/robust-dedicated-actuator-placement.tex', '.github/workflows/build-revised-manuscript.yml']
concurrency:
  group: revised-manuscript-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern poppler-utils
      - name: Compile and check manuscript
        run: |
          set -eu
          cd paper
          for i in 1 2 3; do pdflatex -interaction=nonstopmode -halt-on-error robust-dedicated-actuator-placement.tex; done
          if grep -E 'There were undefined references|Citation .* undefined|Reference .* undefined' robust-dedicated-actuator-placement.log; then exit 1; fi
          pdfinfo robust-dedicated-actuator-placement.pdf
          pdftotext robust-dedicated-actuator-placement.pdf /tmp/manuscript.txt
          grep -q 'worst-case tie-breaking' /tmp/manuscript.txt
      - name: Commit compiled PDF to revision branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add paper/robust-dedicated-actuator-placement.pdf
          git diff --cached --quiet || (git commit -m "Rebuild corrected manuscript PDF" && git push)
